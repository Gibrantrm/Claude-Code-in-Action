name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Project Setup
        run: |
          # Buscamos el package.json y entramos a esa carpeta
          cd $(find . -name "package.json" -printf '%h' -quit)
          npm run setup
          npm run dev:daemon &

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Importante para que sepa dónde está el código
          project_path: ./uigen

          custom_instructions: |
            The project is already set up in the 'uigen' directory.
            The server is running at http://localhost:3000.
            Use mcp__playwright tools to interact with the UI.

          mcp_config: |
            {
              "mcpServers": {
                "playwright": {
                  "command": "npx",
                  "args": [
                    "-y",
                    "@playwright/mcp@latest",
                    "--allowed-origins",
                    "http://localhost:3000",
                    "https://cdn.tailwindcss.com",
                    "https://esm.sh"
                  ]
                }
              }
            }
          
          # Lista explícita sin puntos suspensivos
          allowed_tools: "Bash(npm:*),Bash(sqlite3:*),mcp__playwright__browser_navigate,mcp__playwright__browser_screenshot,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_press,mcp__playwright__browser_wait_for_selector"
          
          additional_permissions: |
            actions: read